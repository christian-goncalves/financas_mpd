<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#173f35">
  <meta name="description" content="Controle simples de contas recorrentes.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Finanças MPD">
  <meta property="og:description" content="Controle simples de contas recorrentes.">
  <meta property="og:url" content="https://financas-mpd.vercel.app/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Finanças MPD">
  <meta name="twitter:description" content="Controle simples de contas recorrentes.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Finanças MPD">

  <script src="./auth-session.js"></script>

  <title>Finanças MPD</title>

  <link rel="canonical" href="https://financas-mpd.vercel.app/">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./vendor/fontawesome/css/fontawesome.min.css">
  <link rel="stylesheet" href="./vendor/fontawesome/css/solid.min.css">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>

<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header__content">
        <h1>Finanças MPD</h1>
      </div>
    </header>

    <main class="app-content" id="conteudo-principal">
      <section class="summary" aria-label="Resumo das contas">
        <div class="summary-grid">
          <div class="summary-card summary-card--overdue">
            <span class="summary-card__value" id="summary-overdue">0</span>
            <span class="summary-card__label">Não Pagas</span>
          </div>
          <div class="summary-card summary-card--today">
            <span class="summary-card__value" id="summary-today">0</span>
            <span class="summary-card__label">Hoje</span>
          </div>
          <div class="summary-card summary-card--upcoming">
            <span class="summary-card__value" id="summary-upcoming">0</span>
            <span class="summary-card__label">A Pagar</span>
          </div>
        </div>
      </section>

      <section class="filter-bar" aria-label="Filtrar contas">
        <button class="filter-chip filter-chip--active" type="button" data-filter="all" aria-pressed="true">
          Todas
        </button>
        <button class="filter-chip filter-chip--overdue" type="button" data-filter="overdue" aria-pressed="false">
          Não Pagas
        </button>
        <button class="filter-chip filter-chip--today" type="button" data-filter="today" aria-pressed="false">
          Hoje
        </button>
        <button class="filter-chip filter-chip--upcoming" type="button" data-filter="upcoming" aria-pressed="false">
          A Pagar
        </button>
      </section>

      <section class="selection-bar" aria-label="Ações da seleção" hidden>
        <button class="button button--primary" id="mark-paid-button" type="button">
          Pagar
        </button>
      </section>

      <div class="feedback" id="feedback" role="status" aria-live="polite"></div>

      <section class="accounts-list" id="accounts-list" aria-label="Lista de contas pendentes" aria-live="polite"
        aria-busy="true"></section>
    </main>

    <div class="modal-backdrop" id="edit-account-modal" role="dialog" aria-modal="true"
      aria-labelledby="edit-account-title" hidden>
      <form class="edit-account-form" id="edit-account-form">
        <div class="edit-account-form__header">
          <h2 id="edit-account-title">Editar conta</h2>
          <button class="modal-close-button" type="button" data-action="close-edit" aria-label="Fechar edição">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>

        <label class="form-field" for="edit-account-name">
          <span>Nome da dívida</span>
          <input id="edit-account-name" name="name" type="text" autocomplete="off" required>
        </label>

        <label class="form-field" for="edit-account-due-date">
          <span>Data de vencimento</span>
          <input id="edit-account-due-date" name="dueDate" type="date" required>
        </label>

        <label class="form-field" for="edit-account-value">
          <span>Valor</span>
          <input id="edit-account-value" name="arsValue" type="number" min="0" step="1" inputmode="numeric" required>
        </label>

        <div class="edit-account-form__actions">
          <button class="button button--secondary" type="button" data-action="close-edit">Cancelar</button>
          <button class="button button--primary" id="edit-account-submit" type="submit">Salvar</button>
        </div>
      </form>
    </div>

    <footer class="app-status" aria-label="Status da aplicação">
      <span class="app-status__indicator" aria-hidden="true"></span>
      <span id="app-status" role="status">Aplicação pronta</span>
    </footer>
  </div>
</body>

</html>
